<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stride Checkout</title>
  <style>
    body{font-family:Inter,system-ui;background:#f9fafb;margin:0;color:#111827}
    .container{max-width:600px;margin:0 auto;padding:20px}
    .btn{padding:12px 16px;border-radius:10px;font-weight:600;border:none;cursor:pointer}
    .btn-primary{background:#111827;color:white}
    form{display:flex;flex-direction:column;gap:14px}
    .input{padding:10px;border:1px solid #d1d5db;border-radius:8px}
  </style>
</head>
<body>
  <main class="container">
    <h1>Checkout</h1>
    <form action="thankyou.html" method="GET">
      <input class="input" type="text" name="name" placeholder="Full Name" required />
      <input class="input" type="email" name="email" placeholder="Email Address" required />
      <input class="input" type="text" name="address" placeholder="Shipping Address" required />
      <button type="submit" class="btn btn-primary">Place Order</button>
    </form>
  </main>
</body>
</html>
